name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Lint, contratos, isolamento e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev --group backend --group legado
      - run: uv run ruff check .
      - name: Portão — esquema e contratos
        run: uv run pytest tests/contratos -q
      - name: Testes (sem serviços externos)
        run: uv run pytest -q -m "not integracao"
      # TODO (Eng. de ML + Cientista de dados): portões de regressão de modelo, erros graves e fidelidade.
      # TODO (Eng. de software): portão de isolamento contra Postgres (services: postgres) e teste de "apagar meus dados".

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
