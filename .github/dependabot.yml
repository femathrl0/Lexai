# Mudança de dependência avisa (ML Test Score Mo1): PR semanal para Python (uv), Actions e frontend.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      ml: { patterns: ["torch", "transformers", "sentence-transformers", "mlflow*", "scikit-learn", "evidently", "peft"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
