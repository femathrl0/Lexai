# Fontes jurídicas do corpus_juridico. Nenhum trecho entra sem fonte, versão e vigência.
# Mudanças passam pela fila ingestao_juridica e pela aprovação da Curadoria (RNF05).
fontes:
  - id: lawcodex-br
    tipo_fonte: lei
    origem: https://github.com/LawCodex/br
    versao: e2a0e14bfc5cddf9a88b2aa05c66536cdb547aa1
    obtido_em: 2026-11-04
    escopo: 25 normas (CLT e correlatas), 5.284 artigos
    licenca: revisão pendente (ver README_lawcodex.md)
  - id: jurisprudencia-base-reduzida
    tipo_fonte: ementa
    origem: ver docs/legado/origens_huggingface_jurisprudencia.md
    versao: a registrar
  - id: recorte-demo-jurisprudencia
    tipo_fonte: [sumula, ementa]
    origem: corpus/jurisprudencia/README.md (Livro de Súmulas do TST + RepoJus TRT-10 2024)
    versao: "tst-livro-sumulas:46321b2d8d04 + repojus:91aa953b3c97"
    obtido_em: 2026-11-19
    escopo: 349 súmulas vigentes do TST e 203 ementas anonimizadas do TRT-10 (buscador local da demo)
    licenca: texto oficial (súmulas); CC BY 4.0 (RepoJus)
  - id: sumulas-oj-tst
    tipo_fonte: [sumula, oj]
    origem: https://www.tst.jus.br/sumulas
    versao: a coletar (Eng. de dados, semana 2) — o recorte acima usa o livro de 2018 só para a demo
  - id: trt10-decisoes
    tipo_fonte: ementa
    origem: https://www.trt10.jus.br
    versao: a coletar
