# Versões EM USO fixadas no repositório (Eng. de ML e MLOps) — a fonte da verdade quando o MLflow não está no ar
# (CI, máquina sem o Compose, contêiner offline). Com o MLflow no ar, o alias "em-uso" do registro tem precedência
# (worker/modelos/registro.py). Mudar este arquivo = promover: só com Eng. de ML + Curadoria, pelo treino/promover.py,
# com linha em docs/changelog_modelos.md.
#
# tipo: regras  -> código em worker/ (versão = commit); hf -> repositório do Hugging Face com revisão fixa;
#       sklearn -> artefato do MLflow (sem versão em uso aqui = o worker usa as regras e se abstém quando não sabe).
classificador_tipo_fase:
  tipo: regras
  versao: regras_cabecalho@0004
  nota: "TF-IDF + LR v1 é só candidato (rótulo provisório); sem cabeçalho o worker se abstém"
  limiares: {abstencao: 0.44}
