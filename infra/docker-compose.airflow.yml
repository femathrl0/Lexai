# Airflow por cima do compose do Lexai (mesma rede: postgres, minio, mlflow). Desenvolvimento:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.airflow.yml --env-file .env up -d airflow
# Produção:
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.airflow.yml --env-file .env.prod up -d
# UI em http://127.0.0.1:18080 (só local/túnel SSH). Usuário admin; a senha gerada fica no log do primeiro início
# (`docker compose … logs airflow | grep -i password`) e em /opt/airflow/simple_auth_manager_passwords.json.generated.
services:
  airflow:
    image: ghcr.io/femathrl0/lexai-airflow:${LEXAI_TAG:-latest}
    build: { context: .., dockerfile: infra/docker/airflow.Dockerfile }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-lexai}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET_ENTRADA: ${MINIO_BUCKET_ENTRADA:-entrada}
      PRAZO_GUARDA_DIAS: ${PRAZO_GUARDA_DIAS:-30}
      LEXAI_PREVISOES_DIR: /opt/lexai/app/dados/output/previsoes
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API__PORT: 8080
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - previsoes:/opt/lexai/app/dados/output  # log de previsões do worker (prod) e saídas de monitoramento
      - airflow_logs:/opt/airflow/logs
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 30s
      retries: 20
      start_period: 120s
    deploy: { resources: { limits: { memory: 6g } } }

volumes:
  previsoes:
  airflow_logs:
