# Sobe os serviços de apoio. Ollama e worker rodam nativos no macOS (contêiner não acessa a GPU do M4).
# Uso: docker compose -f infra/docker-compose.yml --env-file .env up -d
name: lexai

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexai}
      POSTGRES_USER: ${POSTGRES_USER:-lexai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    restart: unless-stopped
    # "db upgrade" migra o banco criado pelo MLflow 2.17 (semanas 1–2) antes de subir o servidor 3.x
    command: >
      sh -c "mlflow db upgrade sqlite:////mlflow/mlflow.db 2>/dev/null || true;
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts 'localhost:*,127.0.0.1:*,mlflow:*'"
    ports: ["127.0.0.1:15000:5000"]
    volumes: [mlflow_data:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    # Armazenamento S3 (entrada dos uploads, originais com opt-in, artefatos do MLflow). A MinIO deixou de publicar
    # imagens públicas em 2025; o SeaweedFS fala a mesma API S3 que o cliente minio e o boto3 usam.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"lexai","credentials":[{"accessKey":"%s","secretKey":"%s"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_USUARIO" "$$S3_SENHA" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_USUARIO: ${MINIO_ROOT_USER:-lexai}
      S3_SENHA: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:19000:9000"]
    volumes: [minio_data:/data]
    healthcheck: { test: ["CMD", "nc", "-z", "127.0.0.1", "9000"], interval: 5s, retries: 30 }

volumes:
  postgres_data:
  mlflow_data:
  minio_data:
