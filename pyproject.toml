[project]
name = "lexai"
version = "0.1.0"
description = "Compreensão de processos trabalhistas com IA — explica, não aconselha (Desafio 2, Residência em IA)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[dependency-groups]
# Backend: atende o usuário e enfileira. NÃO importa nenhuma biblioteca de ML (teste em tests/backend/test_sem_ml.py).
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "minio>=7.2",
]
# Worker: único processo que carrega modelos (roda nativo no macOS, fora do Docker, para usar a GPU do M4).
worker = [
    "redis>=5.0",
    "rq>=1.16",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "mlflow-skinny>=3.18,<4",  # mesmo major do servidor do Compose (infra/docker-compose.yml)
    "PyYAML>=6.0",
    "pillow>=10.0",
]
# OCR (semana 5): só no worker que lê fotos. `uv sync --group worker --group ocr`.
ocr = [
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
]
# Treino e MLOps (Eng. de ML) e dados (Eng. de dados).
treino = [
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "mlflow>=3.18,<4",
    "evidently>=0.4",
    "dvc>=3.50",
    "pandera>=0.20",
    "label-studio-sdk>=1.0",
]
# Notebooks e scripts migrados do lex_clt.ai (EDA, chunking, avaliação).
legado = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.2",
    "pillow>=10.0",
    "pymupdf>=1.24",  # o teste ponta a ponta do documento monta um PDF de verdade no CI
    "ruff>=0.6",
    "fakeredis>=2.23",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[tool.uv]
package = false
default-groups = ["dev", "backend"]
# Evidently (monitoramento de deriva, semana 5) ainda não roda com pandas 3 (ImportError em
# pandas.core.dtypes.common.infer_dtype_from_object, evidently 0.7.23). Rever quando o Evidently suportar.
constraint-dependencies = ["pandas<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: precisa de Postgres, Redis, Ollama ou modelos baixados (não roda no CI padrão)",
    "legado: testes migrados do lex_clt.ai que dependem do grupo 'legado'",
]

[tool.ruff]
line-length = 130
target-version = "py312"
# Código migrado do lex_clt.ai fica fora do lint até ser revisado por cada dono.
extend-exclude = [
    "worker/ingestao/jurisprudencia",
    "worker/ingestao/scripts",
    "worker/evidencia/indices",
    "worker/evidencia/recuperador.py",
    "worker/evidencia/guardas.py",
    "worker/evidencia/explicador.py",
    "worker/evidencia/prompts.py",
    "avaliacao/scripts",
    "avaliacao/notebooks",
    "avaliacao/juiz.py",
    "avaliacao/recuperacao.py",
    "tests/legado",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]
# Depends/Form em defaults é o padrão do FastAPI.


# No Linux (CI, contêineres, máquinas sem GPU NVIDIA) o torch vem do índice CPU do PyTorch,
# que evita baixar ~4 GB de bibliotecas CUDA. No macOS continua o wheel do PyPI (com MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
